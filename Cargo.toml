[package]
name = "proxy-converter"
version = "0.1.0"
edition = "2024"
description = "Fetch remote proxy YAML configs, optionally transform them with JavaScript, and serve the result"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
boa_engine = "0.17"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = "0.12"
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite", "with-chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
